interface:
  display_name: "Risograph Screen Print Picturebook"
  short_description: "Faithful fine-halftone Risograph image transformations"
  default_prompt: "Transform the supplied image into a subject-faithful Japanese picture-book Risograph illustration on an exact 3:4 vertical portrait canvas, with a large fine halftone background, restrained per-image palette, and light print texture. For composite photos, extract and re-center the intended subject instead of applying a uniform filter over the whole scene, while preserving its exact source orientation and directional axis with no rotation, flip, or mirror. Before generating, always ask whether the user wants new text; if yes, wait for exact wording or explicit permission to auto-generate a subject-based title. Never add new text without that confirmation. For a multi-image title set, use the approved HiraMinProN-W6 treatment with fixed size and alignment."
